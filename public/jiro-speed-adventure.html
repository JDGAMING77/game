    // --- GAME LOOP & UPDATES ---
    function updateGame(dt) {
      if (currentState !== STATES.PLAYING) return;

      player.timeElapsed += dt;

      // 1. Player Input & Horizontal Acceleration
      if (keys.left) {
        player.vx -= player.accel;
        player.facingRight = false;
      } else if (keys.right) {
        player.vx += player.accel;
        player.facingRight = true;
      } else {
        player.vx *= player.friction;
        if (Math.abs(player.vx) < 0.1) player.vx = 0;
      }

      // Clamp max horizontal speed
      if (player.vx > player.maxSpeed) player.vx = player.maxSpeed;
      if (player.vx < -player.maxSpeed) player.vx = -player.maxSpeed;

      // Spawn running dust
      if (player.isGrounded && Math.abs(player.vx) > 3.5 && Math.random() < 0.25) {
        spawnDust(player.x + player.width / 2, player.y + player.height, 2, 'rgba(230, 240, 255, 0.6)');
      }

      // 2. Jump Handling (with coyote time & jump buffering)
      if (player.isGrounded) {
        player.coyoteTimer = 6;
      } else {
        if (player.coyoteTimer > 0) player.coyoteTimer--;
      }

      if (keys.jumpBuffered) {
        player.jumpBufferTimer = 6;
        keys.jumpBuffered = false;
      } else {
        if (player.jumpBufferTimer > 0) player.jumpBufferTimer--;
      }

      if (player.jumpBufferTimer > 0 && player.coyoteTimer > 0) {
        player.vy = player.jumpForce;
        player.isGrounded = false;
        player.coyoteTimer = 0;
        player.jumpBufferTimer = 0;
        sound.playJump();
        spawnDust(player.x + player.width / 2, player.y + player.height, 6);
      }

      // Apply Gravity
      player.vy += player.gravity;
      if (player.vy > 14) player.vy = 14; // terminal velocity

      // 3. Move Moving Platforms
      platforms.forEach(p => {
        if (p.moving) {
          p.x += p.speed * p.dir;
          if (p.x > p.originX + p.range) {
            p.x = p.originX + p.range;
            p.dir = -1;
          } else if (p.x < p.originX - p.range) {
            p.x = p.originX - p.range;
            p.dir = 1;
          }
        }
      });

      // 4. Horizontal Movement & Solid Collision
      player.x += player.vx;
      for (const p of platforms) {
        // Only ground tiles collide horizontally; thin platforms are jump-through
        if (p.type === 'ground') {
          if (
            player.x < p.x + p.width &&
            player.x + player.width > p.x &&
            player.y < p.y + p.height &&
            player.y + player.height > p.y + 10
          ) {
            if (player.vx > 0) {
              player.x = p.x - player.width;
              player.vx = 0;
            } else if (player.vx < 0) {
              player.x = p.x + p.width;
              player.vx = 0;
            }
          }
        }
      }

      // 5. Vertical Movement & Platform Landing
      player.y += player.vy;
      player.isGrounded = false;

      for (const p of platforms) {
        // AABB check
        const overlapX = player.x + player.width > p.x + 4 && player.x < p.x + p.width - 4;
        if (overlapX) {
          // Landing on top
          const prevPlayerBottom = player.y + player.height - player.vy;
          if (prevPlayerBottom <= p.y + 8 && player.y + player.height >= p.y) {
            player.y = p.y - player.height;
            player.vy = 0;
            player.isGrounded = true;
            // Carry horizontal speed if on moving platform
            if (p.moving) {
              player.x += p.speed * p.dir;
            }
          }
          // Hitting ceiling of ground blocks
          else if (p.type === 'ground' && player.vy < 0 && player.y <= p.y + p.height && player.y - player.vy >= p.y + p.height - 8) {
            player.y = p.y + p.height;
            player.vy = 0;
          }
        }
      }

      // 6. Springs interaction
      springs.forEach(s => {
        if (
          player.x + player.width > s.x &&
          player.x < s.x + s.width &&
          player.y + player.height >= s.y &&
          player.y + player.height <= s.y + s.height + 12 &&
          player.vy >= 0
        ) {
          player.vy = s.power;
          player.isGrounded = false;
          sound.playJump();
          spawnDust(s.x + s.width / 2, s.y + s.height, 10, '#ff9500');
        }
      });

      // 7. Checkpoints
      CHECKPOINTS.forEach(cp => {
        if (!cp.reached && Math.abs(player.x - cp.x) < 40 && Math.abs(player.y - cp.y) < 70) {
          cp.reached = true;
          player.respawnX = cp.x;
          player.respawnY = cp.y;
          sound.playCheckpoint();
          spawnConfetti(cp.x, cp.y - 40, 15);
        }
      });

      // 8. Collect Coins
      coins.forEach(c => {
        if (!c.collected) {
          const dx = (player.x + player.width / 2) - c.x;
          const dy = (player.y + player.height / 2) - c.y;
          if (Math.hypot(dx, dy) < 26) {
            c.collected = true;
            player.coins++;
            player.score += 100;
            sound.playCoin();
            spawnCoinSparkle(c.x, c.y);
          }
        }
      });

      // 8b. Power-Ups Collision & Collection
      powerups.forEach(p => {
        if (!p.collected) {
          const px = player.x + player.width / 2;
          const py = player.y + player.height / 2;
          const dist = Math.hypot(px - (p.x + p.width / 2), py - (p.y + p.height / 2));
          if (dist < 32) {
            p.collected = true;
            collectPowerUp(p.type, p.x + p.width / 2, p.y + p.height / 2);
          }
        }
      });

      // 8c. Power-Up Active Effects & Timers
      if (player.speedBoostTimer > 0) {
        player.speedBoostTimer -= dt;
        // Electric speed trail particles streaming behind Jiro while running
        if (Math.abs(player.vx) > 3 && Math.random() < 0.45) {
          particles.push({
            x: player.x + (player.facingRight ? 2 : player.width - 2),
            y: player.y + player.height * 0.5 + (Math.random() - 0.5) * 14,
            vx: -player.vx * 0.35 + (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 2,
            radius: Math.random() * 3.5 + 2,
            alpha: 0.85,
            color: Math.random() > 0.4 ? '#fde047' : '#38bdf8',
            decay: 0.045
          });
        }
        if (player.speedBoostTimer <= 0) {
          player.speedBoostTimer = 0;
          player.maxSpeed = 7.8;
          player.accel = 0.65;
          sound.playPowerExpire();
        }
      }

      if (player.superJumpTimer > 0) {
        player.superJumpTimer -= dt;
        // Flame sparks at feet when airborne or dashing
        if ((!player.isGrounded || Math.abs(player.vx) > 2.5) && Math.random() < 0.4) {
          particles.push({
            x: player.x + player.width * 0.5 + (Math.random() - 0.5) * 16,
            y: player.y + player.height - 2,
            vx: (Math.random() - 0.5) * 2,
            vy: -Math.random() * 2.5 - 1,
            radius: Math.random() * 3 + 2,
            alpha: 0.85,
            color: Math.random() > 0.5 ? '#ff7700' : '#fbbf24',
            decay: 0.05
          });
        }
        if (player.superJumpTimer <= 0) {
          player.superJumpTimer = 0;
          player.jumpForce = -12.4;
          sound.playPowerExpire();
        }
      }

      if (player.coinMagnetTimer > 0) {
        player.coinMagnetTimer -= dt;
        // Attract uncollected coins within 260px
        const px = player.x + player.width / 2;
        const py = player.y + player.height / 2;
        coins.forEach(c => {
          if (!c.collected) {
            const dx = px - c.x;
            const dy = py - c.y;
            const dist = Math.hypot(dx, dy);
            if (dist < 260 && dist > 1) {
              const pullSpeed = Math.min(14, 240 / Math.max(20, dist) + 5);
              c.x += (dx / dist) * pullSpeed;
              c.y += (dy / dist) * pullSpeed;
            }
          }
        });
        if (player.coinMagnetTimer <= 0) {
          player.coinMagnetTimer = 0;
          sound.playPowerExpire();
        }
      }

      // Update in-game notification toasts
      for (let i = notifications.length - 1; i >= 0; i--) {
        const notif = notifications[i];
        notif.timer -= dt;
        notif.y -= dt * 12;
        if (notif.timer <= 0) {
          notifications.splice(i, 1);
        }
      }

      // 9. Update Enemies & Stomp / Hurt Collisions
      enemies.forEach(e => {
        if (!e.alive) {
          if (e.squishTimer > 0) e.squishTimer--;
          return;
        }

        // Enemy movement logic
        e.animFrame += 0.1;
        if (e.type === 'bumble') {
          // Bob vertically
          e.y = e.originY + Math.sin(e.animFrame) * 22;
          e.x += e.vx;
        } else {
          e.x += e.vx;
        }

        // Reverse on bounds
        if (e.x < e.minX) {
          e.x = e.minX;
          e.vx = Math.abs(e.vx);
        } else if (e.x > e.maxX) {
          e.x = e.maxX;
          e.vx = -Math.abs(e.vx);
        }

        // Collision with player
        const playerBottom = player.y + player.height;
        const enemyTop = e.y;
        const isOverlapX = player.x + player.width > e.x && player.x < e.x + e.width;
        const isOverlapY = player.y + player.height > e.y && player.y < e.y + e.height;

        if (isOverlapX && isOverlapY) {
          // Stomp detection: player coming downward onto enemy top
          const isStomp = player.vy > 0 && playerBottom - player.vy <= enemyTop + 14;
          if (isStomp) {
            e.alive = false;
            e.squishTimer = 20;
            player.vy = -9.2; // Bounce upwards
            player.score += 250;
            sound.playDefeat();
            spawnDust(e.x + e.width / 2, e.y + e.height / 2, 8, '#ffcc00');
          } else if (player.invulnerableTimer <= 0) {
            if (player.shield) {
              // 1-Hit Energy Shield Absorbs the Attack!
              player.shield = false;
              player.invulnerableTimer = 60; // Brief invulnerability window
              player.vy = -6;
              player.vx = player.facingRight ? -4 : 4;
              sound.playShieldBreak();
              spawnDust(player.x + player.width / 2, player.y + player.height / 2, 22, '#38bdf8');
              showNotification('SHIELD BROKEN!', '#cbd5e1', 'Protection Expended');
            } else {
              // Player hurt!
              player.lives--;
              if (player.lives <= 0) {
                sound.playHurt();
                currentState = STATES.GAMEOVER;
              } else {
                player.invulnerableTimer = 90;
                player.vy = -6;
                player.vx = player.facingRight ? -5 : 5;
                sound.playHurt();
              }
            }
          }
        }
      });

      // 10. Hurt Invulnerability Blink Timer
      if (player.invulnerableTimer > 0) {
        player.invulnerableTimer--;
      }

      // 11. Pitfall / Falling into Gap
      if (player.y > LEVEL_HEIGHT + 100) {
        player.lives--;
        if (player.lives <= 0) {
          sound.playHurt();
          currentState = STATES.GAMEOVER;
        } else {
          respawnPlayer();
        }
      }

      // 12. Finish Flag Reached
      if (!finishFlag.reached) {
        if (player.x + player.width >= finishFlag.x && player.y <= finishFlag.y + finishFlag.height) {
          finishFlag.reached = true;
          player.score += 1000;
          // Time bonus
          const timeBonus = Math.max(0, Math.floor(1500 - player.timeElapsed * 10));
          player.score += timeBonus;
          sound.playComplete();
          spawnConfetti(finishFlag.x + 18, finishFlag.y, 40);
          setTimeout(() => {
            currentState = STATES.VICTORY;
          }, 800);
        }
      }

      // 13. Camera Lerp Following Player
      camera.targetX = player.x - GAME_W * 0.35;
      if (camera.targetX < 0) camera.targetX = 0;
      if (camera.targetX > LEVEL_WIDTH - GAME_W) camera.targetX = LEVEL_WIDTH - GAME_W;
      camera.x += (camera.targetX - camera.x) * CAMERA_LERP;

      // Update particles
      updateParticles();

      // Cloud drift
      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > LEVEL_WIDTH + 200) c.x = -200;
      });
    }

    // --- DRAWING PROCEDURAL ASSETS ---
    function getGroundUnder(x, width, bottomY, platforms) {
      let closestY = null;
      const centerX = x + width / 2;
      for (const plat of platforms) {
        if (centerX >= plat.x - 6 && centerX <= plat.x + plat.width + 6) {
          if (plat.y >= bottomY - 6) {
            if (closestY === null || plat.y < closestY) {
              closestY = plat.y;
            }
          }
        }
      }
      return closestY;
    }

    function drawBackground(ctx, camX) {
      const time = performance.now() * 0.001;

      // 1. Sky Gradient - Rich vibrant atmosphere with warm horizon glow
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_H);
      skyGrad.addColorStop(0, '#1d80db');
      skyGrad.addColorStop(0.42, '#50abff');
      skyGrad.addColorStop(0.78, '#9bd5ff');
      skyGrad.addColorStop(1, '#d8efff');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      // 2. Sun with realistic soft multi-ring coronas and light rays
      ctx.save();
      const sunX = 140 - camX * 0.02;
      const sunY = 85;

      const sunGlow = ctx.createRadialGradient(sunX, sunY, 15, sunX, sunY, 120);
      sunGlow.addColorStop(0, 'rgba(255, 250, 215, 0.95)');
      sunGlow.addColorStop(0.25, 'rgba(255, 235, 140, 0.55)');
      sunGlow.addColorStop(0.6, 'rgba(255, 220, 110, 0.18)');
      sunGlow.addColorStop(1, 'rgba(255, 210, 100, 0)');
      ctx.fillStyle = sunGlow;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 120, 0, Math.PI * 2);
      ctx.fill();

      const coreGrad = ctx.createRadialGradient(sunX - 4, sunY - 4, 2, sunX, sunY, 26);
      coreGrad.addColorStop(0, '#ffffff');
      coreGrad.addColorStop(0.5, '#fff7b8');
      coreGrad.addColorStop(1, '#ffde59');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // 3. Distant Mountains - Two atmospheric layers with sun highlights
      ctx.save();
      const farMtnGrad = ctx.createLinearGradient(0, 200, 0, GAME_H);
      farMtnGrad.addColorStop(0, 'rgba(145, 175, 215, 0.7)');
      farMtnGrad.addColorStop(1, 'rgba(195, 220, 245, 0.9)');
      ctx.fillStyle = farMtnGrad;
      ctx.beginPath();
      ctx.moveTo(0, GAME_H);
      for (let x = 0; x <= GAME_W + 80; x += 60) {
        const worldX = x + camX * 0.04;
        const my = 260 + Math.sin(worldX * 0.002) * 75 + Math.cos(worldX * 0.005) * 45;
        ctx.lineTo(x, my);
      }
      ctx.lineTo(GAME_W, GAME_H);
      ctx.closePath();
      ctx.fill();

      const nearMtnGrad = ctx.createLinearGradient(0, 240, 0, GAME_H);
      nearMtnGrad.addColorStop(0, '#7599c2');
      nearMtnGrad.addColorStop(0.7, '#92b4d8');
      nearMtnGrad.addColorStop(1, '#b7d4ee');
      ctx.fillStyle = nearMtnGrad;
      ctx.beginPath();
      ctx.moveTo(0, GAME_H);
      for (let x = 0; x <= GAME_W + 80; x += 80) {
        const worldX = x + camX * 0.08;
        const my = 290 + Math.sin(worldX * 0.0035 + 1.2) * 55 + Math.cos(worldX * 0.008) * 35;
        ctx.lineTo(x, my);
      }
      ctx.lineTo(GAME_W, GAME_H);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // 4. Clouds - Puffy volumetric cartoon clouds with sunlit tops and soft shaded undersides
      ctx.save();
      clouds.forEach(c => {
        const drawX = c.x - camX * 0.18;
        if (drawX > -180 && drawX < GAME_W + 180) {
          const cw = c.width || 90;
          const ch = c.height || 36;
          const cy = c.y;

          // Underside soft shadow
          ctx.fillStyle = 'rgba(185, 210, 238, 0.75)';
          ctx.beginPath();
          ctx.ellipse(drawX, cy + 5, cw * 0.48, ch * 0.42, 0, 0, Math.PI * 2);
          ctx.ellipse(drawX - cw * 0.24, cy + 8, cw * 0.32, ch * 0.4, 0, 0, Math.PI * 2);
          ctx.ellipse(drawX + cw * 0.24, cy + 8, cw * 0.32, ch * 0.4, 0, 0, Math.PI * 2);
          ctx.fill();

          // Sunlit body
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.ellipse(drawX, cy, cw * 0.45, ch * 0.45, 0, 0, Math.PI * 2);
          ctx.ellipse(drawX - cw * 0.24, cy + 2, cw * 0.3, ch * 0.42, 0, 0, Math.PI * 2);
          ctx.ellipse(drawX + cw * 0.24, cy + 2, cw * 0.3, ch * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();

          // Top highlight
          ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.beginPath();
          ctx.ellipse(drawX - 4, cy - ch * 0.2, cw * 0.28, ch * 0.22, -0.1, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.restore();

      // 5. Midground Rolling Hills - Soft radial gradients with sunlit crest highlights
      ctx.save();
      hills.forEach(h => {
        const drawX = h.x - camX * 0.4;
        const hr = h.radius || 180;
        if (drawX > -hr - 50 && drawX < GAME_W + hr + 50) {
          const hillGrad = ctx.createRadialGradient(
            drawX - hr * 0.35,
            h.y - hr * 0.55,
            hr * 0.1,
            drawX,
            h.y,
            hr
          );
          hillGrad.addColorStop(0, '#75cb58');
          hillGrad.addColorStop(0.55, h.color || '#59b646');
          hillGrad.addColorStop(1, '#3c8e32');

          ctx.fillStyle = hillGrad;
          ctx.beginPath();
          ctx.arc(drawX, h.y, hr, Math.PI, 0, false);
          ctx.fill();

          // Sunlit rim highlight on top-left curve
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(drawX, h.y, hr - 2, Math.PI * 1.08, Math.PI * 1.55);
          ctx.stroke();
        }
      });
      ctx.restore();

      // 6. Midground Trees - Volumetric leaf spheres, cylindrical trunks with soft cast shadows
      ctx.save();
      trees.forEach(t => {
        const drawX = t.x - camX * 0.65;
        if (drawX > -80 && drawX < GAME_W + 80) {
          const th = t.height || 75;
          const sway = Math.sin(time * 2.2 + t.x * 0.02) * 2.5;

          // Soft ground shadow under tree base
          ctx.fillStyle = 'rgba(20, 45, 25, 0.24)';
          ctx.beginPath();
          ctx.ellipse(drawX + 8, t.y + 4, 28, 8, 0, 0, Math.PI * 2);
          ctx.fill();

          // Tree Trunk - cylindrical gradient
          const trunkGrad = ctx.createLinearGradient(drawX - 6, 0, drawX + 6, 0);
          trunkGrad.addColorStop(0, '#a56934');
          trunkGrad.addColorStop(0.35, '#8c5225');
          trunkGrad.addColorStop(1, '#5d3211');
          ctx.fillStyle = trunkGrad;

          ctx.beginPath();
          ctx.moveTo(drawX - 5, t.y);
          ctx.lineTo(drawX - 4, t.y - th * 0.55);
          ctx.lineTo(drawX + 4, t.y - th * 0.55);
          ctx.lineTo(drawX + 6, t.y);
          ctx.closePath();
          ctx.fill();

          // Tree Canopy - Layered spheres with 3D sunlit highlights & deep shadow
          const crownY = t.y - th * 0.65;
          const drawCrownSphere = (cx, cy, r) => {
            const leafGrad = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.15, cx, cy, r);
            leafGrad.addColorStop(0, '#66cb50');
            leafGrad.addColorStop(0.5, '#3b9b2c');
            leafGrad.addColorStop(0.9, '#246b19');
            leafGrad.addColorStop(1, '#174a0e');
            ctx.fillStyle = leafGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            // Subtle specular leaf sheen
            ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
            ctx.beginPath();
            ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.38, 0, Math.PI * 2);
            ctx.fill();
          };

          drawCrownSphere(drawX - 14 + sway * 0.8, crownY + 8, 18);
          drawCrownSphere(drawX + 14 + sway * 1.1, crownY + 8, 18);
          drawCrownSphere(drawX + sway, crownY - 6, 24);
        }
      });
      ctx.restore();
    }

    function drawPlatforms(ctx, camX) {
      platforms.forEach(p => {
        const drawX = p.x - camX;
        if (drawX + p.width < -60 || drawX > GAME_W + 60) return;

        if (p.type === 'ground') {
          // 1. Deep Soil Body with Strata & Gradient
          const soilGrad = ctx.createLinearGradient(0, p.y + 14, 0, p.y + p.height);
          soilGrad.addColorStop(0, '#543621');
          soilGrad.addColorStop(0.18, '#6d4529');
          soilGrad.addColorStop(0.65, '#5c3920');
          soilGrad.addColorStop(1, '#3b2210');
          ctx.fillStyle = soilGrad;
          ctx.fillRect(drawX, p.y, p.width, p.height);

          // Soil strata lines
          ctx.fillStyle = 'rgba(40, 22, 10, 0.35)';
          ctx.fillRect(drawX, p.y + 46, p.width, 3);
          ctx.fillRect(drawX, p.y + 88, p.width, 2.5);

          // Rounded stones with top highlight and drop shadow
          ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
          for (let sx = drawX + 18; sx < drawX + p.width - 18; sx += 48) {
            ctx.beginPath();
            ctx.ellipse(sx, p.y + 36, 5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          for (let sx = drawX + 18; sx < drawX + p.width - 18; sx += 48) {
            ctx.fillStyle = '#806148';
            ctx.beginPath();
            ctx.ellipse(sx, p.y + 34, 4.5, 3, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#aa896d';
            ctx.beginPath();
            ctx.arc(sx - 1.5, p.y + 33, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // 2. Thick Lush Grass Top Layer with Blade Tufts
          ctx.fillStyle = '#225d18';
          ctx.fillRect(drawX, p.y + 14, p.width, 6);

          const grassGrad = ctx.createLinearGradient(0, p.y, 0, p.y + 18);
          grassGrad.addColorStop(0, '#62d242');
          grassGrad.addColorStop(0.4, '#48b82a');
          grassGrad.addColorStop(1, '#2c7b19');
          ctx.fillStyle = grassGrad;
          ctx.fillRect(drawX, p.y, p.width, 16);

          // Stylized grass blade fringes pointing down into the soil
          ctx.fillStyle = '#399920';
          ctx.beginPath();
          for (let gx = drawX; gx < drawX + p.width; gx += 16) {
            ctx.lineTo(gx, p.y + 16);
            ctx.lineTo(gx + 8, p.y + 25);
          }
          ctx.lineTo(drawX + p.width, p.y + 16);
          ctx.closePath();
          ctx.fill();

          // Top sunlit grass edge highlight
          ctx.fillStyle = '#8af568';
          ctx.fillRect(drawX, p.y, p.width, 3);
        } else {
          // FLOATING PLATFORM
          ctx.save();
          // Soft ambient drop shadow underneath
          const dropShadowGrad = ctx.createLinearGradient(0, p.y + p.height, 0, p.y + p.height + 16);
          dropShadowGrad.addColorStop(0, 'rgba(15, 23, 42, 0.28)');
          dropShadowGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
          ctx.fillStyle = dropShadowGrad;
          ctx.fillRect(drawX + 4, p.y + p.height, p.width - 8, 16);

          // Wooden Plank Platform Body with 3D Bevel
          const woodGrad = ctx.createLinearGradient(0, p.y, 0, p.y + p.height);
          woodGrad.addColorStop(0, '#e59d58');
          woodGrad.addColorStop(0.5, '#c87d36');
          woodGrad.addColorStop(1, '#8e4b16');
          ctx.fillStyle = woodGrad;
          ctx.beginPath();
          ctx.roundRect(drawX, p.y, p.width, p.height, 7);
          ctx.fill();

          // Inner plank relief lines
          ctx.strokeStyle = 'rgba(80, 35, 8, 0.45)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(drawX + p.width * 0.33, p.y + 6);
          ctx.lineTo(drawX + p.width * 0.33, p.y + p.height - 2);
          ctx.moveTo(drawX + p.width * 0.66, p.y + 6);
          ctx.lineTo(drawX + p.width * 0.66, p.y + p.height - 2);
          ctx.stroke();

          // Metallic corner rivets with highlights
          const drawRivet = (rx, ry) => {
            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.arc(rx, ry, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(rx - 0.8, ry - 0.8, 1, 0, Math.PI * 2);
            ctx.fill();
          };
          drawRivet(drawX + 6, p.y + p.height - 6);
          drawRivet(drawX + p.width - 6, p.y + p.height - 6);

          // Lush Top Grass Trim
          const topGrassGrad = ctx.createLinearGradient(0, p.y, 0, p.y + 8);
          topGrassGrad.addColorStop(0, '#66da46');
          topGrassGrad.addColorStop(1, '#3a9f20');
          ctx.fillStyle = topGrassGrad;
          ctx.beginPath();
          ctx.roundRect(drawX, p.y, p.width, 8, [7, 7, 0, 0]);
          ctx.fill();

          // Sunlit lip highlight
          ctx.fillStyle = '#94f975';
          ctx.fillRect(drawX + 2, p.y, p.width - 4, 2);

          // Underside bottom edge shade
          ctx.fillStyle = 'rgba(30, 15, 5, 0.4)';
          ctx.fillRect(drawX + 2, p.y + p.height - 2.5, p.width - 4, 2.5);

          ctx.restore();
        }
      });

      // Draw Springs with 3D metallic shading
      springs.forEach(s => {
        const drawX = s.x - camX;
        if (drawX < -40 || drawX > GAME_W + 40) return;

        // Soft ground shadow under spring base
        ctx.fillStyle = 'rgba(15, 23, 42, 0.35)';
        ctx.beginPath();
        ctx.ellipse(drawX + s.width / 2, s.y + s.height, s.width * 0.55, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Base plate
        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.roundRect(drawX - 2, s.y + s.height - 5, s.width + 4, 5, 2);
        ctx.fill();

        // 3D Coiled Metallic Spring with Gradient
        ctx.strokeStyle = '#e67e22';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(drawX + 6, s.y + s.height - 5);
        ctx.lineTo(drawX + s.width - 6, s.y + s.height - 9);
        ctx.lineTo(drawX + 6, s.y + s.height - 13);
        ctx.lineTo(drawX + s.width - 6, s.y + 5);
        ctx.stroke();

        ctx.strokeStyle = '#f9ca24';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Top Launch Cap
        const capGrad = ctx.createLinearGradient(0, s.y, 0, s.y + 7);
        capGrad.addColorStop(0, '#f9ca24');
        capGrad.addColorStop(1, '#d48806');
        ctx.fillStyle = capGrad;
        ctx.beginPath();
        ctx.roundRect(drawX + 1, s.y, s.width - 2, 7, 3);
        ctx.fill();

        ctx.fillStyle = '#fff4a3';
        ctx.fillRect(drawX + 4, s.y + 1, s.width - 8, 2);
      });
    }

    function drawCheckpoints(ctx, camX) {
      const time = performance.now() * 0.003;
      CHECKPOINTS.forEach(cp => {
        const drawX = cp.x - camX;
        if (drawX < -60 || drawX > GAME_W + 60) return;

        // Soft base ground shadow
        ctx.fillStyle = 'rgba(15, 23, 42, 0.3)';
        ctx.beginPath();
        ctx.ellipse(drawX, cp.y, 16, 4.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Pedestal
        ctx.fillStyle = '#475569';
        ctx.beginPath();
        ctx.roundRect(drawX - 8, cp.y - 8, 16, 8, 2);
        ctx.fill();
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(drawX - 6, cp.y - 8, 12, 1.5);

        // Flagpole with cylindrical highlight
        const poleGrad = ctx.createLinearGradient(drawX - 3, 0, drawX + 3, 0);
        poleGrad.addColorStop(0, '#64748b');
        poleGrad.addColorStop(0.4, '#cbd5e1');
        poleGrad.addColorStop(1, '#334155');
        ctx.fillStyle = poleGrad;
        ctx.fillRect(drawX - 2.5, cp.y - 70, 5, 62);

        // Spherical finial topper
        const ballGrad = ctx.createRadialGradient(drawX - 2, cp.y - 74, 1, drawX, cp.y - 72, 7);
        ballGrad.addColorStop(0, '#ffffff');
        ballGrad.addColorStop(0.5, cp.reached ? '#00e5ff' : '#f1c40f');
        ballGrad.addColorStop(1, cp.reached ? '#0084a8' : '#b78103');
        ctx.fillStyle = ballGrad;
        ctx.beginPath();
        ctx.arc(drawX, cp.y - 72, 7, 0, Math.PI * 2);
        ctx.fill();

        // Waving Pennant Flag
        const wave = Math.sin(time * 3 + cp.id) * 3;
        ctx.save();
        if (cp.reached) {
          const flagGrad = ctx.createLinearGradient(drawX, cp.y - 66, drawX + 34, cp.y - 50);
          flagGrad.addColorStop(0, '#00e5ff');
          flagGrad.addColorStop(1, '#0077b6');
          ctx.fillStyle = flagGrad;

          ctx.beginPath();
          ctx.moveTo(drawX + 2.5, cp.y - 66);
          ctx.quadraticCurveTo(drawX + 18, cp.y - 54 + wave, drawX + 36, cp.y - 50 + wave * 1.5);
          ctx.lineTo(drawX + 2.5, cp.y - 34);
          ctx.closePath();
          ctx.fill();

          // Checkmark
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(drawX + 10, cp.y - 50);
          ctx.lineTo(drawX + 15, cp.y - 45);
          ctx.lineTo(drawX + 24, cp.y - 55);
          ctx.stroke();

          // Aura pulse
          const pulse = Math.sin(time * 4) * 4;
          ctx.strokeStyle = 'rgba(0, 229, 255, 0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(drawX, cp.y - 38, 26 + pulse, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#e74c3c';
          ctx.beginPath();
          ctx.moveTo(drawX + 2.5, cp.y - 66);
          ctx.quadraticCurveTo(drawX + 16, cp.y - 54 + wave, drawX + 32, cp.y - 50 + wave * 1.5);
          ctx.lineTo(drawX + 2.5, cp.y - 36);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function drawFinishFlag(ctx, camX) {
      const drawX = finishFlag.x - camX;
      if (drawX < -120 || drawX > GAME_W + 120) return;
      const time = performance.now() * 0.004;

      const groundY = finishFlag.y + finishFlag.height;

      // 1. Base drop shadow anchoring baseplate to ground
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      ctx.beginPath();
      ctx.ellipse(drawX, groundY, 36, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      // 2. Heavy dual-tiered stone pedestal baseplate directly on ground line
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(drawX - 24, groundY - 8, 48, 8, 2);
      ctx.fill();

      // Mid pedestal block
      ctx.fillStyle = '#475569';
      ctx.beginPath();
      ctx.roundRect(drawX - 16, groundY - 16, 32, 9, 2);
      ctx.fill();
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(drawX - 14, groundY - 16, 28, 1.5);

      // Pedestal brass collar locking pole to base
      ctx.fillStyle = '#b8860b';
      ctx.beginPath();
      ctx.roundRect(drawX - 7, groundY - 21, 14, 6, 2);
      ctx.fill();

      // 3. Metallic Golden Flagpole continuous down into collar
      const poleGrad = ctx.createLinearGradient(drawX - 4, 0, drawX + 4, 0);
      poleGrad.addColorStop(0, '#c69214');
      poleGrad.addColorStop(0.4, '#ffd700');
      poleGrad.addColorStop(1, '#8c6004');
      ctx.fillStyle = poleGrad;
      ctx.fillRect(drawX - 3.5, finishFlag.y - 8, 7, finishFlag.height - 10);

      // 4. Ornate Golden Star Topper
      const ballGrad = ctx.createRadialGradient(drawX - 2, finishFlag.y - 10, 2, drawX, finishFlag.y - 8, 12);
      ballGrad.addColorStop(0, '#ffffff');
      ballGrad.addColorStop(0.5, '#ffd700');
      ballGrad.addColorStop(1, '#b8860b');
      ctx.fillStyle = ballGrad;
      ctx.beginPath();
      ctx.arc(drawX, finishFlag.y - 8, 11, 0, Math.PI * 2);
      ctx.fill();

      // 5. Waving Victory Banner with Cloth Folds
      const flagW = 54;
      const flagH = 38;
      const wave = Math.sin(time * 3) * 4;

      ctx.save();
      const bannerGrad = ctx.createLinearGradient(drawX, finishFlag.y, drawX + flagW, finishFlag.y + flagH);
      if (finishFlag.reached) {
        bannerGrad.addColorStop(0, '#10b981');
        bannerGrad.addColorStop(0.5, '#34d399');
        bannerGrad.addColorStop(1, '#059669');
      } else {
        bannerGrad.addColorStop(0, '#0284c7');
        bannerGrad.addColorStop(0.5, '#38bdf8');
        bannerGrad.addColorStop(1, '#0369a1');
      }
      ctx.fillStyle = bannerGrad;

      ctx.beginPath();
      ctx.moveTo(drawX + 3.5, finishFlag.y - 2);
      ctx.quadraticCurveTo(drawX + flagW * 0.5, finishFlag.y + 8 + wave, drawX + flagW, finishFlag.y + 12 + wave * 1.5);
      ctx.lineTo(drawX + flagW - 6, finishFlag.y + 12 + flagH * 0.5 + wave * 1.5);
      ctx.lineTo(drawX + flagW, finishFlag.y - 2 + flagH + wave);
      ctx.quadraticCurveTo(drawX + flagW * 0.5, finishFlag.y - 2 + flagH * 0.8 + wave, drawX + 3.5, finishFlag.y - 2 + flagH);
      ctx.closePath();
      ctx.fill();

      // Golden Emblem Star on Flag
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
      ctx.shadowBlur = 4;
      ctx.fillText('★', drawX + flagW * 0.48, finishFlag.y + 16 + wave);
      ctx.restore();
    }

    function drawCoins(ctx, camX) {
      const time = performance.now() * 0.005;
      coins.forEach(c => {
        if (c.collected) return;
        const drawX = c.x - camX;
        if (drawX < -30 || drawX > GAME_W + 30) return;

        const scaleX = Math.cos(time + c.animOffset);
        const floatY = c.y + Math.sin(time * 0.8 + c.animOffset) * 4;

        ctx.save();
        ctx.translate(drawX, floatY);

        // Subtle warm golden ambient glow behind coin
        const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 18);
        glow.addColorStop(0, 'rgba(255, 230, 80, 0.45)');
        glow.addColorStop(0.6, 'rgba(255, 200, 40, 0.15)');
        glow.addColorStop(1, 'rgba(255, 180, 20, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.scale(Math.abs(scaleX) * 0.88 + 0.12, 1);

        // Coin Outer Rim with Metallic Gradient
        const rimGrad = ctx.createLinearGradient(-11, -11, 11, 11);
        rimGrad.addColorStop(0, '#fff385');
        rimGrad.addColorStop(0.35, '#ffd214');
        rimGrad.addColorStop(0.7, '#d49600');
        rimGrad.addColorStop(1, '#8c5900');
        ctx.fillStyle = rimGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#ffeaa7';
        ctx.stroke();

        ctx.fillStyle = '#ffc000';
        ctx.beginPath();
        ctx.arc(0, 0, 6.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-1.5, -1.5, 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });
    }

    // --- DRAW POWER-UPS (ORIGINAL PROCEDURAL CANVAS ART) ---
    function drawPowerUps(ctx, camX, platformList) {
      const time = performance.now() * 0.004;
      powerups.forEach(p => {
        if (p.collected) return;
        const drawX = p.x - camX;
        if (drawX < -50 || drawX > GAME_W + 50) return;

        const centerX = drawX + p.width / 2;
        const floatY = p.y + Math.sin(time * 3 + p.animOffset) * 5;
        const centerY = floatY + p.height / 2;

        // Ground drop shadow below power-up
        if (platformList) {
          const groundY = getGroundUnder(p.x, p.width, p.y + p.height, platformList);
          if (groundY !== null) {
            const heightAbove = Math.max(0, groundY - (floatY + p.height));
            if (heightAbove < 220) {
              const scale = Math.max(0.2, 1 - heightAbove / 220);
              const alpha = Math.max(0.05, 0.35 * (1 - heightAbove / 220));
              ctx.save();
              ctx.fillStyle = `rgba(15, 23, 42, ${alpha})`;
              ctx.beginPath();
              ctx.ellipse(centerX, groundY, 15 * scale, 4.5 * scale, 0, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
          }
        }

        ctx.save();
        ctx.translate(centerX, centerY);

        // 1. SPEED BOOST (Electric Yellow Lightning Diamond)
        if (p.type === 'speed') {
          // Ambient Glow
          const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 24);
          glow.addColorStop(0, 'rgba(253, 224, 71, 0.65)');
          glow.addColorStop(0.5, 'rgba(234, 179, 8, 0.25)');
          glow.addColorStop(1, 'rgba(202, 138, 4, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 24, 0, Math.PI * 2);
          ctx.fill();

          // Outer Diamond Plaque
          ctx.rotate(Math.sin(time * 2 + p.animOffset) * 0.08);
          ctx.fillStyle = '#ca8a04';
          ctx.beginPath();
          ctx.moveTo(0, -17);
          ctx.lineTo(16, 0);
          ctx.lineTo(0, 17);
          ctx.lineTo(-16, 0);
          ctx.closePath();
          ctx.fill();

          const innerGrad = ctx.createLinearGradient(-12, -12, 12, 12);
          innerGrad.addColorStop(0, '#fef08a');
          innerGrad.addColorStop(0.4, '#eab308');
          innerGrad.addColorStop(1, '#a16207');
          ctx.fillStyle = innerGrad;
          ctx.beginPath();
          ctx.moveTo(0, -14);
          ctx.lineTo(13, 0);
          ctx.lineTo(0, 14);
          ctx.lineTo(-13, 0);
          ctx.closePath();
          ctx.fill();

          // Lightning Bolt Symbol
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(1, -9);
          ctx.lineTo(-6, 0);
          ctx.lineTo(-1, 0);
          ctx.lineTo(-3, 9);
          ctx.lineTo(6, -1);
          ctx.lineTo(1, -1);
          ctx.closePath();
          ctx.fill();

          // Orbiting electric spark
          const spAngle = time * 4 + p.animOffset;
          ctx.fillStyle = '#fde047';
          ctx.beginPath();
          ctx.arc(Math.cos(spAngle) * 18, Math.sin(spAngle) * 18, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. SHIELD (Azure Energy Sphere & Crest)
        else if (p.type === 'shield') {
          const pulse = Math.sin(time * 4 + p.animOffset) * 2;
          const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 25 + pulse);
          glow.addColorStop(0, 'rgba(56, 189, 248, 0.65)');
          glow.addColorStop(0.5, 'rgba(14, 165, 233, 0.25)');
          glow.addColorStop(1, 'rgba(2, 132, 199, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 25 + pulse, 0, Math.PI * 2);
          ctx.fill();

          // Forcefield Sphere
          const orbGrad = ctx.createRadialGradient(-4, -4, 2, 0, 0, 15);
          orbGrad.addColorStop(0, 'rgba(224, 242, 254, 0.95)');
          orbGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.7)');
          orbGrad.addColorStop(1, 'rgba(3, 105, 161, 0.85)');
          ctx.fillStyle = orbGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 15, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Rotating Orbital Ring
          ctx.save();
          ctx.rotate(time * 2 + p.animOffset);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.ellipse(0, 0, 19, 7.5, 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(19, 0, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // Heraldic Mini Shield Crest
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.moveTo(-5, -6);
          ctx.lineTo(5, -6);
          ctx.lineTo(5, 1);
          ctx.quadraticCurveTo(5, 6, 0, 8);
          ctx.quadraticCurveTo(-5, 6, -5, 1);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#0284c7';
          ctx.beginPath();
          ctx.moveTo(-3, -4);
          ctx.lineTo(3, -4);
          ctx.lineTo(3, 1);
          ctx.quadraticCurveTo(3, 4, 0, 6);
          ctx.quadraticCurveTo(-3, 4, -3, 1);
          ctx.closePath();
          ctx.fill();
        }

        // 3. EXTRA LIFE (Crimson Heart)
        else if (p.type === 'life') {
          const beat = Math.sin(time * 5 + p.animOffset) * 0.1;
          ctx.scale(1 + beat, 1 + beat);

          // Warm Ambient Pink Glow
          const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 25);
          glow.addColorStop(0, 'rgba(244, 63, 94, 0.65)');
          glow.addColorStop(0.6, 'rgba(225, 29, 72, 0.25)');
          glow.addColorStop(1, 'rgba(159, 18, 57, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 25, 0, Math.PI * 2);
          ctx.fill();

          // 3D Stylized Heart
          const heartGrad = ctx.createLinearGradient(-10, -10, 10, 10);
          heartGrad.addColorStop(0, '#fda4af');
          heartGrad.addColorStop(0.3, '#f43f5e');
          heartGrad.addColorStop(1, '#9f1239');
          ctx.fillStyle = heartGrad;

          ctx.beginPath();
          ctx.moveTo(0, 4);
          ctx.bezierCurveTo(-14, -10, -14, 8, 0, 15);
          ctx.bezierCurveTo(14, 8, 14, -10, 0, 4);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Gloss Highlight
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.beginPath();
          ctx.ellipse(-5, 0, 3, 2, -0.4, 0, Math.PI * 2);
          ctx.fill();
        }

        // 4. COIN MAGNET (Horseshoe Magnet)
        else if (p.type === 'magnet') {
          // Violet/Purple Glow
          const glow = ctx.createRadialGradient(0, 0, 4, 0, 0, 25);
          glow.addColorStop(0, 'rgba(192, 132, 252, 0.65)');
          glow.addColorStop(0.5, 'rgba(168, 85, 247, 0.25)');
          glow.addColorStop(1, 'rgba(126, 34, 206, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 25, 0, Math.PI * 2);
          ctx.fill();

          ctx.rotate(Math.sin(time * 2.5 + p.animOffset) * 0.12);

          // U-Shaped Magnet Base (Metallic Arch)
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#cbd5e1';
          ctx.beginPath();
          ctx.arc(0, -2, 11, 0, Math.PI, false);
          ctx.stroke();

          // Red Pole (Left)
          ctx.strokeStyle = '#ef4444';
          ctx.beginPath();
          ctx.moveTo(-11, -2);
          ctx.lineTo(-11, 7);
          ctx.stroke();

          // Blue Pole (Right)
          ctx.strokeStyle = '#3b82f6';
          ctx.beginPath();
          ctx.moveTo(11, -2);
          ctx.lineTo(11, 7);
          ctx.stroke();

          // Metallic Caps
          ctx.fillStyle = '#f8fafc';
          ctx.fillRect(-14, 7, 6, 3.5);
          ctx.fillRect(8, 7, 6, 3.5);

          // Magnetic Flux Spark Arc between poles
          const sparkOffset = (Math.sin(time * 12) * 3);
          ctx.strokeStyle = '#facc15';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-8, 8.5);
          ctx.lineTo(0, 6 + sparkOffset);
          ctx.lineTo(8, 8.5);
          ctx.stroke();
        }

        // 5. SUPER JUMP (Blazing Flame Energy Star)
        else if (p.type === 'jump') {
          const flamePulse = Math.sin(time * 6 + p.animOffset) * 3;
          const glow = ctx.createRadialGradient(0, 0, 3, 0, 0, 25 + flamePulse);
          glow.addColorStop(0, 'rgba(251, 146, 60, 0.7)');
          glow.addColorStop(0.5, 'rgba(234, 88, 12, 0.3)');
          glow.addColorStop(1, 'rgba(154, 52, 18, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 25 + flamePulse, 0, Math.PI * 2);
          ctx.fill();

          // Outer Flame Starburst
          ctx.rotate(time * 1.5 + p.animOffset);
          ctx.fillStyle = '#ea580c';
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const rot = (i * Math.PI) / 4;
            const r1 = 15;
            const r2 = 7;
            ctx.lineTo(Math.cos(rot) * r1, Math.sin(rot) * r1);
            ctx.lineTo(Math.cos(rot + Math.PI / 8) * r2, Math.sin(rot + Math.PI / 8) * r2);
          }
          ctx.closePath();
          ctx.fill();

          // Core Hot Yellow Crystal
          ctx.fillStyle = '#fef08a';
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const rot = (i * Math.PI) / 4;
            const r1 = 9;
            const r2 = 4;
            ctx.lineTo(Math.cos(rot) * r1, Math.sin(rot) * r1);
            ctx.lineTo(Math.cos(rot + Math.PI / 8) * r2, Math.sin(rot + Math.PI / 8) * r2);
          }
          ctx.closePath();
          ctx.fill();

          // Upward flame spark
          const fY = (time * 25) % 18;
          ctx.fillStyle = '#ff7700';
          ctx.beginPath();
          ctx.arc(Math.sin(fY) * 6, -10 - fY * 0.5, 2.5 * (1 - fY / 18), 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      });
    }

    function drawEnemies(ctx, camX, platformList) {
      enemies.forEach(e => {
        const drawX = e.x - camX;
        if (drawX < -60 || drawX > GAME_W + 60) return;

        const centerX = drawX + e.width / 2;
        const bottomY = e.y + e.height;

        // Soft ground shadow
        if (e.alive) {
          ctx.save();
          if (e.type === 'bumble') {
            let groundY = bottomY + 25;
            if (platformList) {
              const found = getGroundUnder(e.x, e.width, bottomY, platformList);
              if (found !== null) groundY = found;
            }
            const dist = Math.max(0, groundY - bottomY);
            const shadowScale = Math.max(0.3, 1 - dist / 180);
            ctx.fillStyle = `rgba(15, 23, 42, ${0.25 * shadowScale})`;
            ctx.beginPath();
            ctx.ellipse(centerX, groundY, 14 * shadowScale, 4.5 * shadowScale, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = 'rgba(15, 23, 42, 0.32)';
            ctx.beginPath();
            ctx.ellipse(centerX, bottomY - 1, e.width * 0.44, 4, 0, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        ctx.save();
        ctx.translate(centerX, e.y + e.height / 2);

        if (!e.alive) {
          ctx.scale(1.4, 0.25);
          ctx.fillStyle = '#64748b';
          ctx.beginPath();
          ctx.arc(0, 0, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          return;
        }

        if (e.vx < 0) ctx.scale(-1, 1);

        if (e.type === 'sprout') {
          const footWiggle = Math.sin(e.animFrame * 2.5) * 4;

          ctx.fillStyle = '#c0392b';
          ctx.beginPath();
          ctx.ellipse(-7, 10 + footWiggle, 5.5, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(7, 10 - footWiggle, 5.5, 4, 0, 0, Math.PI * 2);
          ctx.fill();

          const bodyGrad = ctx.createRadialGradient(-5, -5, 2, 0, 0, 15);
          bodyGrad.addColorStop(0, '#58d68d');
          bodyGrad.addColorStop(0.65, '#27ae60');
          bodyGrad.addColorStop(1, '#196f3d');
          ctx.fillStyle = bodyGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 14, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
          ctx.beginPath();
          ctx.arc(-5, -5, 5, 0, Math.PI * 2);
          ctx.fill();

          const leafSway = Math.sin(e.animFrame * 1.8) * 0.15;
          ctx.save();
          ctx.translate(0, -13);
          ctx.rotate(leafSway);
          const leafGrad = ctx.createLinearGradient(-3, -12, 3, 0);
          leafGrad.addColorStop(0, '#2ecc71');
          leafGrad.addColorStop(1, '#1e8449');
          ctx.fillStyle = leafGrad;
          ctx.beginPath();
          ctx.ellipse(0, -6, 3.5, 8, 0.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(6, -2, 5, 6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(8, -2, 2.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(7.2, -3.5, 1.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (e.type === 'bumble') {
          const wingFlap = Math.sin(e.animFrame * 7) * 7;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.beginPath();
          ctx.ellipse(-3, -13 + wingFlap, 11, 4.5, -0.3, 0, Math.PI * 2);
          ctx.fill();

          const beeGrad = ctx.createRadialGradient(-3, -4, 2, 0, 0, 15);
          beeGrad.addColorStop(0, '#fff176');
          beeGrad.addColorStop(0.6, '#fbc02d');
          beeGrad.addColorStop(1, '#f57f17');
          ctx.fillStyle = beeGrad;
          ctx.beginPath();
          ctx.ellipse(0, 0, 14, 11, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#1e293b';
          ctx.fillRect(-2, -10, 4, 20);
          ctx.fillRect(4, -9, 3, 18);

          ctx.fillStyle = '#d32f2f';
          ctx.beginPath();
          ctx.moveTo(-14, 0);
          ctx.lineTo(-8, -4);
          ctx.lineTo(-8, 4);
          ctx.closePath();
          ctx.fill();

          const eyeGlow = ctx.createRadialGradient(8, -2, 1, 8, -2, 5);
          eyeGlow.addColorStop(0, '#ffffff');
          eyeGlow.addColorStop(0.5, '#00e5ff');
          eyeGlow.addColorStop(1, '#0097a7');
          ctx.fillStyle = eyeGlow;
          ctx.beginPath();
          ctx.arc(8, -2, 4.8, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const shellGrad = ctx.createRadialGradient(-4, -6, 2, 0, 0, 16);
          shellGrad.addColorStop(0, '#c084fc');
          shellGrad.addColorStop(0.6, '#9333ea');
          shellGrad.addColorStop(1, '#581c87');
          ctx.fillStyle = shellGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 14, Math.PI, 0, false);
          ctx.lineTo(14, 10);
          ctx.lineTo(-14, 10);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 9, Math.PI, 0, false);
          ctx.stroke();

          ctx.fillStyle = '#1e293b';
          ctx.beginPath();
          ctx.roundRect(-11, 8, 7, 5, 2);
          ctx.fill();
          ctx.beginPath();
          ctx.roundRect(4, 8, 7, 5, 2);
          ctx.fill();

          ctx.fillStyle = '#ef4444';
          ctx.shadowColor = '#ef4444';
          ctx.shadowBlur = 6;
          ctx.fillRect(6, -2, 6, 3.5);
          ctx.shadowBlur = 0;
        }

        ctx.restore();
      });
    }

    // --- DRAW JIRO (HUMANOID CARTOON PLATFORMER REDESIGN) ---
    function drawJiro(ctx, camX, platformList) {
      if (player.invulnerableTimer > 0 && Math.floor(player.invulnerableTimer / 4) % 2 === 0) {
        return;
      }

      const centerX = player.x - camX + player.width / 2;
      const bottomY = player.y + player.height;

      // Soft ground shadow on surface below
      if (platformList) {
        const groundY = getGroundUnder(player.x, player.width, bottomY, platformList);
        if (groundY !== null) {
          const heightAbove = Math.max(0, groundY - bottomY);
          if (heightAbove < 260) {
            const scale = Math.max(0.25, 1 - heightAbove / 280);
            const alpha = Math.max(0.04, 0.3 * (1 - heightAbove / 260));
            const shadowOffsetX = heightAbove * 0.08;

            ctx.save();
            ctx.fillStyle = `rgba(15, 23, 42, ${alpha})`;
            ctx.beginPath();
            ctx.ellipse(centerX + shadowOffsetX, groundY, 16 * scale, 5 * scale, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
      }

      ctx.save();
      ctx.translate(centerX, player.y + player.height / 2);

      if (!player.facingRight) {
        ctx.scale(-1, 1);
      }

      const speedRatio = Math.min(1, Math.abs(player.vx) / player.maxSpeed);
      player.runFrame += Math.abs(player.vx) * 0.16;

      if (player.isGrounded && Math.abs(player.vx) > 1) {
        ctx.rotate(0.08 + speedRatio * 0.06);
      } else if (!player.isGrounded) {
        ctx.rotate(player.vy * 0.025);
      }

      const bobY = player.isGrounded ? Math.sin(player.runFrame * 2) * (1.8 * speedRatio) : 0;
      const time = performance.now() * 0.005;

      // A. Back Arm (Far Arm)
      ctx.save();
      let backArmAngle = 0;
      if (!player.isGrounded) {
        backArmAngle = player.vy < 0 ? -0.8 : -0.3;
      } else if (Math.abs(player.vx) > 0.5) {
        backArmAngle = -Math.sin(player.runFrame) * (0.8 + speedRatio * 0.3);
      } else {
        backArmAngle = Math.sin(time) * 0.08;
      }
      ctx.translate(-2, 1 + bobY);
      ctx.rotate(backArmAngle);

      ctx.fillStyle = '#cc5200';
      ctx.beginPath();
      ctx.roundRect(-3, 0, 6, 12, 3);
      ctx.fill();

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(0, 13, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // B. Back Leg (Far Leg)
      ctx.save();
      let backFootX = -6;
      let backFootY = 16;
      if (!player.isGrounded) {
        backFootX = -10;
        backFootY = 14;
      } else if (Math.abs(player.vx) > 0.5) {
        backFootX = -Math.sin(player.runFrame) * (11 * speedRatio);
        backFootY = 16 - Math.abs(Math.cos(player.runFrame)) * 6;
      }

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(backFootX - 3, 6 + bobY, 6, 9, 2);
      ctx.fill();

      ctx.fillStyle = '#b91c1c';
      ctx.beginPath();
      ctx.ellipse(backFootX, backFootY + bobY, 6.5, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(backFootX - 5, backFootY + bobY + 1.8, 10, 2.5);
      ctx.restore();

      // C. Torso / Sporty Adventurer Jacket
      ctx.save();
      ctx.translate(0, bobY);

      const jacketGrad = ctx.createLinearGradient(-8, 0, 8, 0);
      jacketGrad.addColorStop(0, '#ff9e3b');
      jacketGrad.addColorStop(0.35, '#ff7700');
      jacketGrad.addColorStop(1, '#c44800');
      ctx.fillStyle = jacketGrad;

      ctx.beginPath();
      ctx.moveTo(-6, -4);
      ctx.lineTo(6, -4);
      ctx.lineTo(5.5, 8);
      ctx.lineTo(-5.5, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff3c4';
      ctx.beginPath();
      ctx.moveTo(-2, -4);
      ctx.lineTo(2, -4);
      ctx.lineTo(1, 4);
      ctx.lineTo(-1, 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-1, 3, 2, 3);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-6, 7.5, 12, 2.5);
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(-1.5, 7, 3, 3.5);
      ctx.restore();

      // D. Front Leg (Near Leg)
      ctx.save();
      let frontFootX = 6;
      let frontFootY = 16;
      if (!player.isGrounded) {
        frontFootX = 7;
        frontFootY = 11;
      } else if (Math.abs(player.vx) > 0.5) {
        frontFootX = Math.sin(player.runFrame) * (11 * speedRatio);
        frontFootY = 16 - Math.abs(Math.sin(player.runFrame)) * 6;
      }

      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(frontFootX - 3.5, 6 + bobY, 7, 9, 2);
      ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.ellipse(frontFootX, frontFootY + bobY, 7.5, 4.8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fca5a5';
      ctx.beginPath();
      ctx.arc(frontFootX + 3, frontFootY + bobY - 1, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(frontFootX - 6, frontFootY + bobY + 1.8, 12, 2.8);
      ctx.restore();

      // E. Head & Face
      ctx.save();
      const headY = -12 + bobY;
      ctx.translate(0, headY);

      const ribbonWave = Math.sin(time * 8) * (3 + speedRatio * 4);
      const ribbonLen = 18 + speedRatio * 18;

      const ribGrad = ctx.createLinearGradient(-10, 0, -10 - ribbonLen, 0);
      ribGrad.addColorStop(0, '#00d2ff');
      ribGrad.addColorStop(1, '#0077b6');
      ctx.fillStyle = ribGrad;

      ctx.beginPath();
      ctx.moveTo(-8, -4);
      ctx.quadraticCurveTo(-14 - speedRatio * 10, -8 + ribbonWave, -8 - ribbonLen, -6 + ribbonWave * 1.3);
      ctx.lineTo(-6 - ribbonLen, -2 + ribbonWave * 1.3);
      ctx.quadraticCurveTo(-12 - speedRatio * 8, -3 + ribbonWave, -8, 0);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-8, -1);
      ctx.quadraticCurveTo(-14 - speedRatio * 8, 2 - ribbonWave * 0.8, -6 - ribbonLen * 0.85, 4 - ribbonWave);
      ctx.lineTo(-4 - ribbonLen * 0.85, 7 - ribbonWave);
      ctx.quadraticCurveTo(-10 - speedRatio * 6, 4 - ribbonWave * 0.8, -8, 2);
      ctx.closePath();
      ctx.fill();

      const skinGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 12);
      skinGrad.addColorStop(0, '#ffdfc4');
      skinGrad.addColorStop(0.55, '#fec9a1');
      skinGrad.addColorStop(1, '#e29a6b');
      ctx.fillStyle = skinGrad;

      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#804000';
      ctx.beginPath();
      ctx.moveTo(-8, -5);
      ctx.quadraticCurveTo(-12, -12, -4, -13);
      ctx.quadraticCurveTo(0, -15, 6, -11);
      ctx.quadraticCurveTo(2, -9, 0, -7);
      ctx.closePath();
      ctx.fill();

      const headBandGrad = ctx.createLinearGradient(-11, 0, 11, 0);
      headBandGrad.addColorStop(0, '#0096c7');
      headBandGrad.addColorStop(0.5, '#00b4d8');
      headBandGrad.addColorStop(1, '#48cae4');
      ctx.fillStyle = headBandGrad;
      ctx.beginPath();
      ctx.roundRect(-11, -7, 22, 6.5, 3);
      ctx.fill();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fillRect(-9, -7, 18, 1.5);

      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(3, -4, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(2.2, -4.8, 1, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(4.5, 1, 5, 6, 0.08, 0, Math.PI * 2);
      ctx.fill();

      const eyeGrad = ctx.createLinearGradient(3, -2, 7, 5);
      eyeGrad.addColorStop(0, '#0284c7');
      eyeGrad.addColorStop(0.5, '#0369a1');
      eyeGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = eyeGrad;
      ctx.beginPath();
      ctx.ellipse(5.5, 1, 3.2, 4.5, 0.05, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(4.8, -1, 1.6, 0, Math.PI * 2);
      ctx.arc(6.8, 2.5, 1, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#5a2500';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(1.5, -4.5);
      ctx.lineTo(8, -3.8);
      ctx.stroke();

      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(3.5, 5, 3.2, 0.2, Math.PI * 0.8);
      ctx.stroke();

      ctx.fillStyle = 'rgba(248, 113, 113, 0.42)';
      ctx.beginPath();
      ctx.ellipse(1, 4.5, 3.5, 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // F. Front Arm (Near Arm)
      ctx.save();
      let frontArmAngle = 0;
      if (!player.isGrounded) {
        frontArmAngle = player.vy < 0 ? 1.0 : 0.4;
      } else if (Math.abs(player.vx) > 0.5) {
        frontArmAngle = Math.sin(player.runFrame) * (0.8 + speedRatio * 0.3);
      } else {
        frontArmAngle = -Math.sin(time) * 0.08;
      }

      ctx.translate(1, 1 + bobY);
      ctx.rotate(frontArmAngle);

      const armGrad = ctx.createLinearGradient(-3, 0, 3, 0);
      armGrad.addColorStop(0, '#ff9e3b');
      armGrad.addColorStop(1, '#ff6a00');
      ctx.fillStyle = armGrad;
      ctx.beginPath();
      ctx.roundRect(-3, 0, 6, 12, 3);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-3, 10, 6, 2);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 13.5, 3.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.15)';
      ctx.beginPath();
      ctx.arc(0.5, 14.5, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();

      // Active Power-Up Visual Auras on Jiro
      const charCenterY = player.y + player.height / 2;

      // 1. Shield Energy Forcefield Bubble
      if (player.shield) {
        const sTime = performance.now() * 0.004;
        const pulse = Math.sin(sTime * 4) * 2;
        const sRadius = 26 + pulse;

        ctx.save();
        ctx.translate(centerX, charCenterY);

        // Soft outer cyan glow
        const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, sRadius + 8);
        glow.addColorStop(0, 'rgba(56, 189, 248, 0.15)');
        glow.addColorStop(0.7, 'rgba(14, 165, 233, 0.35)');
        glow.addColorStop(1, 'rgba(2, 132, 199, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, sRadius + 8, 0, Math.PI * 2);
        ctx.fill();

        // Translucent shield sphere
        ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
        ctx.beginPath();
        ctx.arc(0, 0, sRadius, 0, Math.PI * 2);
        ctx.fill();

        // Forcefield perimeter ring
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.8;
        ctx.stroke();

        // Orbiting energy ellipse & spark node
        ctx.save();
        ctx.rotate(sTime * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.ellipse(0, 0, sRadius + 4, (sRadius + 4) * 0.36, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(sRadius + 4, 0, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.restore();
      }

      // 2. Coin Magnet Flux Aura
      if (player.coinMagnetTimer > 0) {
        const mTime = performance.now() * 0.005;
        ctx.save();
        ctx.translate(centerX, charCenterY);
        const mPulse = Math.sin(mTime * 5) * 3;
        ctx.strokeStyle = 'rgba(192, 132, 252, 0.45)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(0, 0, 30 + mPulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }
    }

    // --- HUD & USER INTERFACE ---
    function drawHUD(ctx) {
      // Modern Clean Floating HUD Pills
      ctx.save();
      const padding = 16;
      const topY = 16;

      const drawPill = (x, y, w, h, icon, label, val) => {
        // Pill background
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, h / 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Icon
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(icon, x + 10, y + h / 2);

        // Label & Value
        ctx.font = 'bold 11px system-ui, sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(label, x + 34, y + h / 2 - 5);

        ctx.font = 'bold 14px system-ui, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(val, x + 34, y + h / 2 + 7);
      };

      // Score Pill
      drawPill(padding, topY, 130, 38, '🏆', 'SCORE', player.score.toLocaleString());

      // Coins Pill
      drawPill(padding + 140, topY, 105, 38, '🪙', 'COINS', `${player.coins}`);

      // Lives Pill (Heart badges up to max 5)
      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.beginPath();
      ctx.roundRect(padding + 255, topY, 138, 38, 19);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.stroke();

      ctx.font = '15px sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      let hearts = '';
      for (let i = 0; i < 5; i++) {
        hearts += i < player.lives ? '❤️' : '🖤';
      }
      ctx.fillText(hearts, padding + 266, topY + 19);

      // Time Pill
      const mins = Math.floor(player.timeElapsed / 60);
      const secs = Math.floor(player.timeElapsed % 60);
      const ms = Math.floor((player.timeElapsed % 1) * 10);
      const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms}`;
      drawPill(GAME_W - padding - 120, topY, 120, 38, '⏱️', 'TIME', timeStr);

      // --- POWER STATUS INDICATORS ---
      const activePowers = [];
      if (player.speedBoostTimer > 0) {
        activePowers.push({
          name: 'SPEED BOOST',
          icon: '⚡',
          color: '#facc15',
          bg: 'rgba(234, 179, 8, 0.25)',
          border: '#eab308',
          ratio: Math.min(1, player.speedBoostTimer / 7.0),
          timeText: `${player.speedBoostTimer.toFixed(1)}s`
        });
      }
      if (player.shield) {
        activePowers.push({
          name: 'SHIELD',
          icon: '🛡️',
          color: '#38bdf8',
          bg: 'rgba(14, 165, 233, 0.25)',
          border: '#0ea5e9',
          ratio: 1.0,
          timeText: '1-HIT'
        });
      }
      if (player.coinMagnetTimer > 0) {
        activePowers.push({
          name: 'MAGNET',
          icon: '🧲',
          color: '#c084fc',
          bg: 'rgba(168, 85, 247, 0.25)',
          border: '#a855f7',
          ratio: Math.min(1, player.coinMagnetTimer / 8.0),
          timeText: `${player.coinMagnetTimer.toFixed(1)}s`
        });
      }
      if (player.superJumpTimer > 0) {
        activePowers.push({
          name: 'SUPER JUMP',
          icon: '🔥',
          color: '#fb923c',
          bg: 'rgba(249, 115, 22, 0.25)',
          border: '#f97316',
          ratio: Math.min(1, player.superJumpTimer / 7.0),
          timeText: `${player.superJumpTimer.toFixed(1)}s`
        });
      }

      if (activePowers.length > 0) {
        const startY = 62;
        let curX = padding;
        activePowers.forEach(pow => {
          const pillW = 142;
          const pillH = 28;

          ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
          ctx.beginPath();
          ctx.roundRect(curX, startY, pillW, pillH, 8);
          ctx.fill();
          ctx.strokeStyle = pow.border;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          // Progress bar fill
          if (pow.ratio > 0 && pow.ratio < 1) {
            ctx.fillStyle = pow.bg;
            ctx.beginPath();
            ctx.roundRect(curX + 2, startY + 2, (pillW - 4) * pow.ratio, pillH - 4, 6);
            ctx.fill();
          }

          // Icon
          ctx.font = '13px sans-serif';
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(pow.icon, curX + 7, startY + pillH / 2);

          // Name
          ctx.font = 'bold 10px system-ui, sans-serif';
          ctx.fillStyle = pow.color;
          ctx.fillText(pow.name, curX + 26, startY + pillH / 2 - 4);

          // Time / Status
          ctx.font = 'bold 11px monospace';
          ctx.fillStyle = '#ffffff';
          ctx.textAlign = 'right';
          ctx.fillText(pow.timeText, curX + pillW - 7, startY + pillH / 2);

          curX += pillW + 8;
        });
      }

      // --- FLOATING NOTIFICATION BANNERS ---
      notifications.forEach(notif => {
        const alpha = Math.min(1, notif.timer / 0.3);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.textAlign = 'center';

        const badgeW = 280;
        const badgeH = notif.subtext ? 50 : 38;
        ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
        ctx.beginPath();
        ctx.roundRect(GAME_W / 2 - badgeW / 2, notif.y - badgeH / 2, badgeW, badgeH, 12);
        ctx.fill();
        ctx.strokeStyle = notif.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.shadowColor = notif.color;
        ctx.shadowBlur = 10;
        ctx.font = 'bold 16px system-ui, sans-serif';
        ctx.fillStyle = notif.color;
        ctx.fillText(notif.text, GAME_W / 2, notif.subtext ? notif.y - 6 : notif.y + 1);

        if (notif.subtext) {
          ctx.shadowBlur = 0;
          ctx.font = '12px system-ui, sans-serif';
          ctx.fillStyle = '#cbd5e1';
          ctx.fillText(notif.subtext, GAME_W / 2, notif.y + 14);
        }

        ctx.restore();
      });

      ctx.restore();
    }

    // --- OVERLAY SCREENS ---
    function drawStartScreen(ctx) {
      // Backdrop darkener with warm glow
      ctx.fillStyle = 'rgba(10, 16, 30, 0.82)';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      ctx.save();
      ctx.textAlign = 'center';

      // Animated Title
      const titleBob = Math.sin(performance.now() * 0.003) * 6;
      ctx.font = '900 52px system-ui, -apple-system, sans-serif';

      // Title Shadow
      ctx.fillStyle = '#0f172a';
      ctx.fillText('JIRO: SPEED ADVENTURE', GAME_W / 2, 142 + titleBob);

      // Title Core
      ctx.fillStyle = '#ff9f1c';
      ctx.fillText('JIRO: SPEED ADVENTURE', GAME_W / 2, 138 + titleBob);

      // Subtitle
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('AN ORIGINAL FAST-PACED 2D PLATFORMER', GAME_W / 2, 185);

      // Draw mascot on start screen (Humanoid Jiro)
      const mx = GAME_W / 2;
      const my = 255 + titleBob * 0.5;
      ctx.save();
      ctx.translate(mx, my);
      ctx.scale(1.7, 1.7);

      // Mascot pedestal shadow
      ctx.fillStyle = 'rgba(15, 23, 42, 0.4)';
      ctx.beginPath();
      ctx.ellipse(0, 20, 16, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Back Arm
      ctx.save();
      ctx.translate(-2, 1);
      ctx.rotate(-0.25);
      ctx.fillStyle = '#cc5200';
      ctx.beginPath();
      ctx.roundRect(-3, 0, 6, 11, 3);
      ctx.fill();
      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(0, 12, 3.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Legs
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(-7, 6, 5.5, 9, 2);
      ctx.fill();
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.roundRect(1.5, 6, 5.5, 9, 2);
      ctx.fill();

      // Shoes
      ctx.fillStyle = '#b91c1c';
      ctx.beginPath();
      ctx.ellipse(-4.5, 16, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.ellipse(4.5, 16, 6.5, 4.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-8.5, 17.5, 8, 2);
      ctx.fillRect(0.5, 17.5, 8.5, 2);

      // Torso / Jacket
      const mascotJacket = ctx.createLinearGradient(-7, 0, 7, 0);
      mascotJacket.addColorStop(0, '#ff9e3b');
      mascotJacket.addColorStop(0.35, '#ff7700');
      mascotJacket.addColorStop(1, '#c44800');
      ctx.fillStyle = mascotJacket;
      ctx.beginPath();
      ctx.moveTo(-6, -4);
      ctx.lineTo(6, -4);
      ctx.lineTo(5.5, 8);
      ctx.lineTo(-5.5, 8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#fff3c4';
      ctx.beginPath();
      ctx.moveTo(-2, -4);
      ctx.lineTo(2, -4);
      ctx.lineTo(1, 4);
      ctx.lineTo(-1, 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-6, 7.5, 12, 2.5);

      // Head
      ctx.save();
      ctx.translate(0, -12);

      // Trailing Headband Ribbons
      const ribW = Math.sin(performance.now() * 0.006) * 3;
      ctx.fillStyle = '#00b4d8';
      ctx.beginPath();
      ctx.moveTo(-8, -4);
      ctx.quadraticCurveTo(-16, -6 + ribW, -22, -4 + ribW);
      ctx.lineTo(-20, 0 + ribW);
      ctx.quadraticCurveTo(-14, -2 + ribW, -8, -1);
      ctx.closePath();
      ctx.fill();

      // Face
      const mascotFace = ctx.createRadialGradient(-3, -3, 2, 0, 0, 12);
      mascotFace.addColorStop(0, '#ffdfc4');
      mascotFace.addColorStop(0.55, '#fec9a1');
      mascotFace.addColorStop(1, '#e29a6b');
      ctx.fillStyle = mascotFace;
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      // Hair
      ctx.fillStyle = '#804000';
      ctx.beginPath();
      ctx.moveTo(-8, -5);
      ctx.quadraticCurveTo(-12, -12, -4, -13);
      ctx.quadraticCurveTo(0, -15, 6, -11);
      ctx.quadraticCurveTo(2, -9, 0, -7);
      ctx.closePath();
      ctx.fill();

      // Headband
      ctx.fillStyle = '#00b4d8';
      ctx.beginPath();
      ctx.roundRect(-11, -7, 22, 6.5, 3);
      ctx.fill();
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(3, -4, 3, 0, Math.PI * 2);
      ctx.fill();

      // Big Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(4.5, 1, 5, 6, 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.ellipse(5.5, 1, 3.2, 4.5, 0.05, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(4.8, -1, 1.6, 0, Math.PI * 2);
      ctx.arc(6.8, 2.5, 1, 0, Math.PI * 2);
      ctx.fill();

      // Eyebrow & Smile
      ctx.strokeStyle = '#5a2500';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';

      ctx.moveTo(1.5, -4.5);
      ctx.lineTo(8, -3.8);

      ctx.strokeStyle = '#7c2d12';
      ctx.beginPath();
      ctx.arc(3.5, 5, 3.2, 0.2, Math.PI * 0.8);

      ctx.beginPath();
      ctx.ellipse(1, 4.5, 3.5, 2, 0, 0, Math.PI * 2);
