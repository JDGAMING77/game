<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Jiro: Speed Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d131f;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #ffffff;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 16 / 9;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    /* Touch Controls for Mobile / Tablets */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      padding: 0 24px;
      pointer-events: none;
      justify-content: space-between;
      z-index: 100;
    }
    .touch-btn-group {
      display: flex;
      gap: 16px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 24px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      cursor: pointer;
    }
    .touch-btn:active {
      background: rgba(255, 255, 255, 0.7);
      transform: scale(0.92);
    }
    /* Fallback notification / orientation warning if needed */
    #audio-prompt {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 50;
      transition: background 0.2s;
    }
    #audio-prompt:hover {
      background: rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="audio-prompt" onclick="toggleAudio()" title="Toggle Sound">
      <span id="audio-icon">🔊</span> <span id="audio-text">Audio ON</span>
    </div>
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- On-screen controls for touchscreen devices -->
    <div id="touch-controls">
      <div class="touch-btn-group">
        <div class="touch-btn" id="btn-left">◀</div>
        <div class="touch-btn" id="btn-right">▶</div>
      </div>
      <div class="touch-btn-group">
        <div class="touch-btn" id="btn-jump">▲</div>
      </div>
    </div>
  </div>

  <script>
    /**
     * JIRO: SPEED ADVENTURE
     * Complete 2D Fast-Paced Platformer
     * Pure Canvas & Vanilla JavaScript - No External Dependencies
     */

    // --- SOUND SYNTHESIZER (Web Audio API) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playJump() {
        if (!this.enabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          const now = this.ctx.currentTime;
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(480, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.17);
        } catch(e) {}
      }

      playCoin() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          // Two bell tones
          [988, 1318].forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.06);
            gain.gain.setValueAtTime(0.25, now + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.06);
            osc.stop(now + i * 0.06 + 0.22);
          });
        } catch(e) {}
      }

      playDefeat() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.19);
        } catch(e) {}
      }

      playHurt() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.linearRampToValueAtTime(60, now + 0.25);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.26);
        } catch(e) {}
      }

      playCheckpoint() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.2, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.32);
          });
        } catch(e) {}
      }

      playComplete() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          // Fanfare arpeggio
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.3, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + (idx === notes.length - 1 ? 0.8 : 0.25));
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + (idx === notes.length - 1 ? 0.85 : 0.28));
          });
        } catch(e) {}
      }

      playPowerUp() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.05);
            gain.gain.setValueAtTime(0.25, now + idx * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.05);
            osc.stop(now + idx * 0.05 + 0.22);
          });
        } catch(e) {}
      }

      playShield() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(960, now + 0.25);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.34);
        } catch(e) {}
      }

      playShieldBreak() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.2);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.22);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } catch(e) {}
      }

      playExtraLife() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.28, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.26);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.28);
          });
        } catch(e) {}
      }

      playPowerExpire() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [660, 520, 392].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.18, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.16);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.18);
          });
        } catch(e) {}
      }

      playBossWarning() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          for (let i = 0; i < 3; i++) {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(360, now + i * 0.28);
            osc.frequency.exponentialRampToValueAtTime(580, now + i * 0.28 + 0.18);
            gain.gain.setValueAtTime(0.3, now + i * 0.28);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.28 + 0.22);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + i * 0.28);
            osc.stop(now + i * 0.28 + 0.24);
          }
        } catch(e) {}
      }

      playBossRoar() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.linearRampToValueAtTime(70, now + 0.7);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.8);
        } catch(e) {}
      }

      playEscapeSuccess() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const notes = [392, 523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.28, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + (idx === notes.length - 1 ? 0.6 : 0.2));
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + (idx === notes.length - 1 ? 0.65 : 0.22));
          });
        } catch(e) {}
      }

      playBossDefeated() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const notes = [261.63, 329.63, 392, 523.25, 659.25, 783.99, 1046.5];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.32, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + (idx === notes.length - 1 ? 0.9 : 0.25));
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + (idx === notes.length - 1 ? 0.95 : 0.28));
          });
        } catch(e) {}
      }

      playMilestone() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          [659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
            gain.gain.setValueAtTime(0.22, now + idx * 0.07);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.07 + 0.28);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.07);
            osc.stop(now + idx * 0.07 + 0.3);
          });
        } catch(e) {}
      }

      playEnemyHit() {
        if (!this.enabled || !this.ctx) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(420, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.14);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } catch(e) {}
      }
    }

    const sound = new SoundFX();

    function toggleAudio() {
      sound.init();
      sound.enabled = !sound.enabled;
      document.getElementById('audio-icon').textContent = sound.enabled ? '🔊' : '🔇';
      document.getElementById('audio-text').textContent = sound.enabled ? 'Audio ON' : 'Audio OFF';
    }

    // --- GAME ENGINE SETUP ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Safe Canvas roundRect polyfill for legacy/all browser engines
    if (!ctx.roundRect) {
      ctx.roundRect = function(x, y, w, h, r) {
        if (typeof r === 'undefined') r = 0;
        const rad = typeof r === 'number' ? r : (r[0] || 0);
        this.beginPath();
        this.moveTo(x + rad, y);
        this.lineTo(x + w - rad, y);
        this.quadraticCurveTo(x + w, y, x + w, y + rad);
        this.lineTo(x + w, y + h - rad);
        this.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
        this.lineTo(x + rad, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - rad);
        this.lineTo(x, y + rad);
        this.quadraticCurveTo(x, y, x + rad, y);
        this.closePath();
        return this;
      };
    }

    // Virtual Internal Resolution (16:9)
    const GAME_W = 960;
    const GAME_H = 540;

    // Game States
    const STATES = {
      START: 'start',
      CONTROLS: 'controls',
      PLAYING: 'playing',
      PAUSED: 'paused',
      GAMEOVER: 'gameover',
      VICTORY: 'victory'
    };

    let currentState = STATES.START;

    // Input Handling
    const keys = {
      left: false,
      right: false,
      jump: false,
      jumpBuffered: false
    };

    window.addEventListener('keydown', (e) => {
      sound.init();
      const code = e.code;
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) {
        e.preventDefault();
      }

      if (code === 'KeyA' || code === 'ArrowLeft') keys.left = true;
      if (code === 'KeyD' || code === 'ArrowRight') keys.right = true;
      if (code === 'Space' || code === 'KeyW' || code === 'ArrowUp') {
        if (!keys.jump) {
          keys.jumpBuffered = true;
        }
        keys.jump = true;
      }

      if (code === 'KeyP') {
        if (currentState === STATES.PLAYING) {
          currentState = STATES.PAUSED;
        } else if (currentState === STATES.PAUSED) {
          currentState = STATES.PLAYING;
        }
      }

      if (code === 'KeyR') {
        if (currentState === STATES.GAMEOVER || currentState === STATES.VICTORY) {
          resetGame();
          currentState = STATES.PLAYING;
        }
      }

      if (code === 'KeyM') {
        toggleAudio();
      }
    });

    window.addEventListener('keyup', (e) => {
      const code = e.code;
      if (code === 'KeyA' || code === 'ArrowLeft') keys.left = false;
      if (code === 'KeyD' || code === 'ArrowRight') keys.right = false;
      if (code === 'Space' || code === 'KeyW' || code === 'ArrowUp') {
        keys.jump = false;
        if (player.vy < -3) {
          player.vy *= 0.5; // Variable jump height
        }
      }
    });

    // Touch Support for mobile / touchpads
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      const touchControls = document.getElementById('touch-controls');
      if (touchControls) touchControls.style.display = 'flex';

      const setupTouch = (id, onDown, onUp) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('touchstart', (e) => { e.preventDefault(); sound.init(); onDown(); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
      };

      setupTouch('btn-left', () => keys.left = true, () => keys.left = false);
      setupTouch('btn-right', () => keys.right = true, () => keys.right = false);
      setupTouch('btn-jump', () => { keys.jump = true; keys.jumpBuffered = true; }, () => {
        keys.jump = false;
        if (player.vy < -3) player.vy *= 0.5;
      });
    }

    // Click handling for UI buttons
    canvas.addEventListener('click', (e) => {
      sound.init();
      const rect = canvas.getBoundingClientRect();
      const scaleX = GAME_W / rect.width;
      const scaleY = GAME_H / rect.height;
      const mx = (e.clientX - rect.left) * scaleX;
      const my = (e.clientY - rect.top) * scaleY;

      handleMenuClick(mx, my);
    });

    // --- PARTICLE SYSTEM ---
    let particles = [];
    function spawnDust(x, y, count = 5, color = 'rgba(255, 255, 255, 0.7)') {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x + (Math.random() - 0.5) * 12,
          y: y,
          vx: (Math.random() - 0.5) * 3,
          vy: -Math.random() * 2 - 0.5,
          radius: Math.random() * 3 + 2,
          alpha: 1,
          color: color,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function spawnCoinSparkle(x, y) {
      for (let i = 0; i < 8; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 2,
          alpha: 1,
          color: '#ffd700',
          decay: 0.03
        });
      }
    }

    function spawnConfetti(x, y, count = 20) {
      const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#007aff', '#af52de'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          radius: Math.random() * 4 + 2,
          alpha: 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          decay: 0.015
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // slight gravity
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function renderParticles(ctx, camX) {
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // --- GAME WORLD & ENTITIES ---
    const LEVEL_WIDTH = 5800;
    const LEVEL_HEIGHT = 650;
    const CAMERA_LERP = 0.08;
