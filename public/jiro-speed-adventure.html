      ctx.translate(1, 1);
      ctx.rotate(0.35);
      ctx.fillStyle = '#ff7700';
      ctx.beginPath();
      ctx.roundRect(-3, 0, 6, 11, 3);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 13, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.restore();

      // UI Buttons
      drawButton(ctx, GAME_W / 2 - 130, 330, 260, 52, '▶ PLAY GAME', '#22c55e');
      drawButton(ctx, GAME_W / 2 - 130, 400, 260, 48, '📖 CONTROLS', '#3b82f6');

      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Press [Space] or Click PLAY to begin • 100% Free & Original', GAME_W / 2, 485);

      ctx.restore();
    }

    function drawControlsScreen(ctx) {
      ctx.fillStyle = 'rgba(10, 16, 30, 0.9)';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      ctx.save();
      ctx.textAlign = 'center';

      ctx.font = '900 36px system-ui, sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('HOW TO PLAY', GAME_W / 2, 90);

      // Controls Grid
      const items = [
        { key: 'A  or  ◀', action: 'Move Left' },
        { key: 'D  or  ▶', action: 'Move Right' },
        { key: 'SPACE / W / ▲', action: 'Jump (Hold for higher jump)' },
        { key: 'P', action: 'Pause / Resume' },
        { key: 'R', action: 'Restart Game' },
        { key: 'M', action: 'Mute / Unmute Audio' }
      ];

      items.forEach((it, idx) => {
        const y = 140 + idx * 44;
        // Key Badge
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(GAME_W / 2 - 240, y, 160, 36, 8);
        ctx.fill();
        ctx.strokeStyle = '#475569';
        ctx.stroke();

        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(it.key, GAME_W / 2 - 160, y + 23);

        // Action Label
        ctx.font = '500 15px system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#cbd5e1';
        ctx.fillText(it.action, GAME_W / 2 - 50, y + 23);
        ctx.textAlign = 'center';
      });

      // Tips & Power-Up Legend Box
      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.beginPath();
      ctx.roundRect(GAME_W / 2 - 270, 410, 540, 56, 10);
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillStyle = '#fde047';
      ctx.fillText('⚡ Speed Boost (7s)   🛡️ Shield (1-Hit)   ❤️ +1 Life   🧲 Magnet (8s)   🔥 Super Jump (7s)', GAME_W / 2, 430);

      ctx.font = '12px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Collect power-ups along the run to smash speed records and stay protected!', GAME_W / 2, 450);

      drawButton(ctx, GAME_W / 2 - 100, 478, 200, 42, '← BACK', '#64748b');
      ctx.restore();
    }

    function drawPauseScreen(ctx) {
      ctx.fillStyle = 'rgba(10, 16, 30, 0.75)';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      ctx.save();
      ctx.textAlign = 'center';

      ctx.font = '900 44px system-ui, sans-serif';
      ctx.fillStyle = '#f8fafc';
      ctx.fillText('PAUSED', GAME_W / 2, 170);

      drawButton(ctx, GAME_W / 2 - 120, 220, 240, 50, 'RESUME', '#22c55e');
      drawButton(ctx, GAME_W / 2 - 120, 285, 240, 46, 'CONTROLS', '#3b82f6');
      drawButton(ctx, GAME_W / 2 - 120, 345, 240, 46, 'RESTART', '#ef4444');

      ctx.font = '13px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('Press [P] to quick resume', GAME_W / 2, 420);
      ctx.restore();
    }

    function drawGameOverScreen(ctx) {
      ctx.fillStyle = 'rgba(15, 5, 10, 0.88)';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      ctx.save();
      ctx.textAlign = 'center';

      ctx.font = '900 52px system-ui, sans-serif';
      ctx.fillStyle = '#ef4444';
      ctx.fillText('GAME OVER', GAME_W / 2, 160);

      ctx.font = '500 18px system-ui, sans-serif';
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText(`Final Score: ${player.score.toLocaleString()}  •  Coins: ${player.coins}`, GAME_W / 2, 215);

      drawButton(ctx, GAME_W / 2 - 130, 270, 260, 54, '🔄 TRY AGAIN (R)', '#22c55e');
      drawButton(ctx, GAME_W / 2 - 130, 340, 260, 48, 'MAIN MENU', '#64748b');
      ctx.restore();
    }

    function drawVictoryScreen(ctx) {
      ctx.fillStyle = 'rgba(5, 20, 30, 0.88)';
      ctx.fillRect(0, 0, GAME_W, GAME_H);

      ctx.save();
      ctx.textAlign = 'center';

      const pulse = Math.sin(performance.now() * 0.005) * 4;
      ctx.font = '900 52px system-ui, sans-serif';
      ctx.fillStyle = '#facc15';
      ctx.fillText('STAGE CLEARED!', GAME_W / 2, 140 + pulse);

      ctx.font = '700 20px system-ui, sans-serif';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('Congratulations! Jiro conquered the course!', GAME_W / 2, 185);

      // Score breakdown card
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.roundRect(GAME_W / 2 - 200, 215, 400, 130, 12);
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.stroke();

      const mins = Math.floor(player.timeElapsed / 60);
      const secs = Math.floor(player.timeElapsed % 60);
      const timeStr = `${mins}m ${secs}s`;

      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`Clear Time: ${timeStr}`, GAME_W / 2, 250);
      ctx.fillText(`Coins Collected: ${player.coins} (+${player.coins * 100} pts)`, GAME_W / 2, 280);

      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = '#22c55e';
      ctx.fillText(`TOTAL SCORE: ${player.score.toLocaleString()}`, GAME_W / 2, 320);

      drawButton(ctx, GAME_W / 2 - 130, 370, 260, 52, '★ PLAY AGAIN (R)', '#22c55e');
      drawButton(ctx, GAME_W / 2 - 130, 435, 260, 46, 'MAIN MENU', '#64748b');

      ctx.restore();
    }

    function drawButton(ctx, x, y, w, h, text, bgColor) {
      ctx.save();
      ctx.fillStyle = bgColor;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 10);
      ctx.fill();

      // Highlight bevel
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.roundRect(x, y, w, h / 2, [10, 10, 0, 0]);
      ctx.fill();

      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, x + w / 2, y + h / 2);
      ctx.restore();
    }

    // --- BUTTON CLICK HANDLERS ---
    function handleMenuClick(mx, my) {
      const inBox = (bx, by, bw, bh) => mx >= bx && mx <= bx + bw && my >= by && my <= by + bh;

      if (currentState === STATES.START) {
        if (inBox(GAME_W / 2 - 130, 330, 260, 52)) {
          resetGame();
          currentState = STATES.PLAYING;
        } else if (inBox(GAME_W / 2 - 130, 400, 260, 48)) {
          currentState = STATES.CONTROLS;
        }
      } else if (currentState === STATES.CONTROLS) {
        if (inBox(GAME_W / 2 - 100, 475, 200, 44)) {
          currentState = STATES.START;
        }
      } else if (currentState === STATES.PAUSED) {
        if (inBox(GAME_W / 2 - 120, 220, 240, 50)) {
          currentState = STATES.PLAYING;
        } else if (inBox(GAME_W / 2 - 120, 285, 240, 46)) {
          currentState = STATES.CONTROLS;
        } else if (inBox(GAME_W / 2 - 120, 345, 240, 46)) {
          resetGame();
          currentState = STATES.PLAYING;
        }
      } else if (currentState === STATES.GAMEOVER) {
        if (inBox(GAME_W / 2 - 130, 270, 260, 54)) {
          resetGame();
          currentState = STATES.PLAYING;
        } else if (inBox(GAME_W / 2 - 130, 340, 260, 48)) {
          currentState = STATES.START;
        }
      } else if (currentState === STATES.VICTORY) {
        if (inBox(GAME_W / 2 - 130, 370, 260, 52)) {
          resetGame();
          currentState = STATES.PLAYING;
        } else if (inBox(GAME_W / 2 - 130, 435, 260, 46)) {
          currentState = STATES.START;
        }
      }
    }

    // --- MAIN RENDER DISPATCHER ---
    function render() {
      ctx.clearRect(0, 0, GAME_W, GAME_H);

      // Always draw the level backdrop & scene
      drawBackground(ctx, camera.x);
      drawCheckpoints(ctx, camera.x);
      drawPlatforms(ctx, camera.x);
      drawFinishFlag(ctx, camera.x);
      drawCoins(ctx, camera.x);
      drawPowerUps(ctx, camera.x, platforms);
      drawEnemies(ctx, camera.x, platforms);
      drawJiro(ctx, camera.x, platforms);
      renderParticles(ctx, camera.x);

      // HUD is active during gameplay and paused
      if (currentState === STATES.PLAYING || currentState === STATES.PAUSED) {
        drawHUD(ctx);
      }

      // Overlays
      if (currentState === STATES.START) drawStartScreen(ctx);
      else if (currentState === STATES.CONTROLS) drawControlsScreen(ctx);
      else if (currentState === STATES.PAUSED) drawPauseScreen(ctx);
      else if (currentState === STATES.GAMEOVER) drawGameOverScreen(ctx);
      else if (currentState === STATES.VICTORY) drawVictoryScreen(ctx);
    }

    // --- ENGINE TICK ---
    let lastTime = performance.now();
    function tick(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.05); // cap frame step
      lastTime = currentTime;

      updateGame(dt);
      render();

      requestAnimationFrame(tick);
    }

    // Initialize & Boot
    initLevel();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
